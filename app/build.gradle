plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

def universalApk = project.hasProperty('universal')

android {
    namespace 'br.com.cardapiofc'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.cardapiofc'
        minSdk 26
        targetSdk 35
        versionCode 114
        versionName '4.1'
        ndk {
            // Padrão compacto ARM64; use -Puniversal para incluir também x86_64.
            if (universalApk) abiFilters 'arm64-v8a', 'x86_64'
            else abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            storeFile rootProject.file('cardapio-zero.jks')
            storePassword 'cardapiofc-zero'
            keyAlias 'cardapiofc-zero'
            keyPassword 'cardapiofc-zero'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        jniLibs {
            // Compacta os .so no APK; o Android os extrai normalmente na instalação.
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
}

chaquopy {
    defaultConfig {
        version = '3.12'
        buildPython '/usr/bin/python3.12'
        pip {
            install 'fastapi==0.115.6'
            install 'requests==2.32.3'
            install 'urllib3==2.3.0'
        }
    }
}
