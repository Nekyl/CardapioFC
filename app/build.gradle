plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

def signingPropertiesFile = rootProject.file('signing.properties')
def universalApk = project.hasProperty('universal')
def signingProperties = new Properties()
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}
def hasReleaseSigning = signingPropertiesFile.exists()

android {
    namespace 'br.com.cardapiofc'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.cardapiofc'
        minSdk 26
        targetSdk 35
        versionCode 108
        versionName '2.8'
        ndk {
            if (universalApk) abiFilters 'arm64-v8a', 'x86_64'
            else abiFilters 'arm64-v8a'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    packagingOptions {
        jniLibs { useLegacyPackaging true }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = '3.12'
        buildPython '/usr/bin/python3.12'
        pip {
            install 'fastapi==0.115.6'
            install 'requests==2.32.3'
            install 'urllib3==2.3.0'
        }
    }
}
