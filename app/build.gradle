plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

def universalApk = project.hasProperty('universal')

// Assinatura local de release: copie signing.properties.example para
// signing.properties (arquivo no .gitignore) e preencha com os dados da keystore.
def signingProps = new Properties()
def signingPropsFile = rootProject.file('signing.properties')
if (signingPropsFile.exists()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}

android {
    namespace 'br.com.cardapiofc'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.cardapiofc'
        minSdk 26
        targetSdk 35
        versionCode 133
        versionName '4.14'
        ndk {
            // Padrão compacto ARM64; use -Puniversal para incluir também x86_64.
            if (universalApk) abiFilters 'arm64-v8a', 'x86_64'
            else abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            storeFile rootProject.file(signingProps.getProperty('storeFile', 'cardapio-zero.jks'))
            storePassword signingProps.getProperty('storePassword', '')
            keyAlias signingProps.getProperty('keyAlias', 'cardapiofc-zero')
            keyPassword signingProps.getProperty('keyPassword', '')
        }
    }

    buildTypes {
        release {
            // Sem signing.properties, a release é gerada sem assinatura.
            if (signingPropsFile.exists()) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Release: nome final por variante para builds não se sobrescreverem.
    // O AGP apaga a saída anterior a cada build, então o APK também é copiado
    // para dist/ na raiz do projeto após o assemble.
    applicationVariants.all { variant ->
        if (variant.buildType.name != 'release') return
        variant.outputs.all { output ->
            outputFileName = "CardapioFC-${variant.versionName}-${universalApk ? 'universal' : 'arm64'}.apk"
        }
        variant.assembleProvider.configure {
            doLast {
                def distDir = rootProject.file('dist')
                distDir.mkdirs()
                project.copy {
                    from variant.outputs.first().outputFile
                    into distDir
                }
            }
        }
    }

    packagingOptions {
        jniLibs {
            // Compacta os .so no APK; o Android os extrai normalmente na instalação.
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
}

chaquopy {
    defaultConfig {
        version = '3.12'
        buildPython project.findProperty('chaquoPython') ?: '/usr/bin/python3.12'
        pip {
            install 'fastapi==0.115.6'
            install 'requests==2.32.3'
            install 'urllib3==2.3.0'
        }
    }
}
