<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0e" />
    <meta name="description" content="Calendário de jogos e onde assistir." />
    <title>Cardápio FC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/styles.css?v=20261103-2" />
    <script defer src="/static/app.js?v=20261103-3"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="top-bar content-width">
          <nav class="tabs" aria-label="Navegação principal">
            <button class="tab-button is-active" type="button" data-tab="todos">Todos</button>
            <button class="tab-button" type="button" data-tab="ligas">Ligas</button>
          </nav>
          <button class="top-menu-button" type="button" data-action="open-iptv" aria-label="Abrir menu IPTV" aria-haspopup="dialog" aria-controls="iptv-dialog">
            <span></span><span></span><span></span>
          </button>
        </div>

        <div class="date-rail content-width" id="date-rail" aria-label="Escolha o dia"></div>

        <div class="league-rail content-width is-hidden" id="league-rail">
          <div class="league-chips" id="league-chips"></div>
          <button class="league-menu-button" type="button" data-action="open-leagues" aria-label="Abrir lista de ligas" aria-haspopup="dialog" aria-controls="league-drawer">
            <svg class="list-menu-icon" viewBox="0 0 32 32" aria-hidden="true">
              <circle cx="5" cy="7" r="2.25" />
              <path d="M13 7h15" />
              <circle cx="5" cy="16" r="2.25" />
              <path d="M13 16h15" />
              <circle cx="5" cy="25" r="2.25" />
              <path d="M13 25h15" />
            </svg>
          </button>
        </div>
        <div class="today-toolbar content-width is-hidden" id="today-toolbar" aria-live="polite">
          <div class="today-toolbar-league">
            <span class="today-toolbar-dot" aria-hidden="true"></span>
            <span id="sticky-league-name">—</span>
          </div>
          <label class="live-toggle">
            <span>Ao Vivo</span>
            <input id="live-only-toggle" type="checkbox" aria-label="Mostrar somente jogos ao vivo">
            <span class="toggle-track" aria-hidden="true"><span class="toggle-thumb"></span></span>
          </label>
        </div>
      </header>

      <main class="content-width main-content">
        <div class="loading-state" id="loading-state" aria-live="polite">
        </div>
        <div class="empty-state is-hidden" id="empty-state" aria-live="polite">Nenhum jogo nesta data.</div>
        <div class="error-state is-hidden" id="error-state" aria-live="polite">Não foi possível carregar os jogos agora.</div>
        <div id="matches-content"></div>
      </main>

      <div class="modal-layer is-hidden" id="league-drawer" role="dialog" aria-modal="true" aria-labelledby="league-drawer-title">
        <button class="modal-backdrop" type="button" data-action="close-leagues" aria-label="Fechar lista de ligas"></button>
        <aside class="league-drawer-panel">
          <div class="drawer-header">
            <h2 id="league-drawer-title">Time da liga</h2>
            <button class="close-button" type="button" data-action="close-leagues" aria-label="Fechar">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
            </button>
          </div>
          <div class="league-list" id="league-list"></div>
        </aside>
      </div>

      <div class="modal-layer is-hidden" id="match-modal" role="dialog" aria-modal="true" aria-labelledby="match-modal-title">
        <button class="modal-backdrop dark" type="button" data-action="close-match" aria-label="Fechar detalhes"></button>
        <section class="match-modal-panel">
          <div class="match-modal-header">
            <div>
              <p class="modal-kicker" id="match-modal-league"></p>
              <h2 id="match-modal-title"></h2>
              <p class="modal-meta" id="match-modal-meta"></p>
            </div>
            <button class="close-button" type="button" data-action="close-match" aria-label="Fechar">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
            </button>
          </div>
          <p class="broadcast-label">Onde assistir</p>
          <button class="broadcast-back-button is-hidden" id="broadcast-back-button" type="button" data-action="back-to-channels">‹&nbsp; Voltar aos canais</button>
          <ul class="broadcast-list" id="broadcast-list"></ul>
        </section>
      </div>

      <div class="modal-layer is-hidden" id="iptv-dialog" role="dialog" aria-modal="true" aria-labelledby="iptv-dialog-title">
        <button class="modal-backdrop" type="button" data-action="close-iptv" aria-label="Fechar menu IPTV"></button>
        <section class="iptv-panel">
          <div class="drawer-header"><div><h2 id="iptv-dialog-title">Lista IPTV</h2><p class="iptv-status-line" id="iptv-status-line">Nenhuma lista conectada.</p></div><button class="close-button" type="button" data-action="close-iptv" aria-label="Fechar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg></button></div>
          <div id="iptv-login-form">
            <div class="iptv-mode-tabs"><button type="button" class="iptv-mode is-active" data-iptv-mode="xtream">Xtream Codes</button><button type="button" class="iptv-mode" data-iptv-mode="m3u">Link M3U</button></div>
            <div class="iptv-fields" id="iptv-xtream-fields"><label>Servidor<input id="iptv-server" type="url" autocomplete="url" placeholder="https://servidor.exemplo"></label><label>Usuário<input id="iptv-user" type="text" autocomplete="username"></label><label>Senha<input id="iptv-password" type="password" autocomplete="current-password"></label></div>
            <div class="iptv-fields is-hidden" id="iptv-m3u-fields"><label>Link da playlist M3U<input id="iptv-m3u" type="url" autocomplete="url" placeholder="https://.../playlist.m3u"></label></div>
            <button class="iptv-primary-button" type="button" data-action="connect-iptv">Conectar lista</button>
            <p class="iptv-hint">Use somente listas e conteúdos para os quais você possui autorização.</p>
          </div>
          <div class="iptv-connected-actions is-hidden" id="iptv-connected-actions"><button class="iptv-secondary-button" type="button" data-action="refresh-iptv">Atualizar canais</button><button class="iptv-danger-button" type="button" data-action="disconnect-iptv">Desconectar e apagar dados</button></div>
        </section>
      </div>
    </div>
  </body>
</html>
